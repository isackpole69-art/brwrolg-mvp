<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewLog Pro</title>
    <style>
        /* MPANGILIO WA RANGI */
        :root {
            --primary-coffee: #6f4e37;
            --accent-gold: #d2a679;
            --bg-light: #fdfaf5;
            --text-dark: #2c1e14;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* 1. UKURASA WA KUKARIBISHA (SPLASH PAGE) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: transform 0.8s ease-in-out;
            color: white;
            text-align: center;
        }

        #splash-screen.hidden {
            transform: translateY(-100%);
        }

        .welcome-title { font-size: 2.5rem; margin: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .welcome-sub { font-size: 1.2rem; margin-bottom: 30px; opacity: 0.9; }

        .enter-btn {
            background-color: var(--accent-gold);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            transition: 0.3s;
        }

        .enter-btn:hover { background-color: var(--primary-coffee); transform: scale(1.05); }

        /* 2. MUONEKANO WA APP */
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #timer-display {
            font-size: 3.5rem;
            text-align: center;
            font-family: monospace;
            color: var(--primary-coffee);
            margin: 20px 0;
        }

        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary-coffee); color: white; }
        .btn-outline { background: none; border: 2px solid var(--primary-coffee); color: var(--primary-coffee); }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .log-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 id="greeting-text" class="welcome-title">Habari!</h1>
        <p class="welcome-sub">Karibu kwenye BrewLog Pro</p>
        <button class="enter-btn" onclick="enterApp()">Anza Kutengeneza Kahawa</button>
    </div>

    <div class="app-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">BrewLog Pro</h2>
            <button onclick="toggleMode()" style="width: auto; padding: 5px 15px;">🌓 Mode</button>
        </div>

        <div class="card">
            <h3 style="text-align: center; margin-top: 0;">Timer ya Brew</h3>
            <div id="timer-display">00:00</div>
            <div class="btn-group">
                <button id="startStopBtn" class="btn-main" onclick="toggleTimer()">Start</button>
                <button class="btn-outline" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <div class="card">
            <h3>Andika Kumbukumbu</h3>
            <input type="text" id="beanName" placeholder="Jina la Kahawa (mfano: Kilimanjaro)">
            <select id="method">
                <option value="V60">V60</option>
                <option value="Espresso">Espresso</option>
                <option value="French Press">French Press</option>
            </select>
            <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5">
            <button class="btn-main" style="width: 100%;" onclick="saveLog()">Save Brew & Time</button>
        </div>

        <div class="card">
            <h3>Historia ya Brew</h3>
            <div id="logList"></div>
        </div>
    </div>

    <script>
        // 1. SALAMU ZA KUKARIBISHA
        function setGreeting() {
            const hour = new Date().getHours();
            const gText = document.getElementById('greeting-text');
            if (hour < 12) gText.innerText = "☕ Habari za Asubuhi!";
            else if (hour < 16) gText.innerText = "☀️ Habari za Mchana!";
            else if (hour < 21) gText.innerText = "🌆 Habari za Jioni!";
            else gText.innerText = "🌙 Usiku Mwema!";
        }

        function enterApp() {
            document.getElementById('splash-screen').classList.add('hidden');
        }

        // 2. LOGIC YA TIMER
        let timerInterval, seconds = 0, isRunning = false;
        function toggleTimer() {
            const btn = document.getElementById('startStopBtn');
            if (!isRunning) {
                isRunning = true; btn.innerText = "Stop";
                timerInterval = setInterval(() => { seconds++; updateDisplay(); }, 1000);
            } else {
                isRunning = false; btn.innerText = "Start"; clearInterval(timerInterval);
            }
        }
        function updateDisplay() {
            const m = Math.floor(seconds/60).toString().padStart(2,'0');
            const s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }
        function resetTimer() { seconds = 0; updateDisplay(); }

        // 3. HIFADHI KUMBUKUMBU
        function saveLog() {
            const name = document.getElementById('beanName').value;
            const time = document.getElementById('timer-display').innerText;
            const rating = document.getElementById('rating').value;
            const method = document.getElementById('method').value;

            if(!name || !rating) { alert("Tafadhali jaza jina na rating!"); return; }
            
            const logs = JSON.parse(localStorage.getItem('coffeeLogs')) || [];
            logs.push({ name, time, rating, method, date: new Date().toLocaleDateString('sw-TZ') });
            localStorage.setItem('coffeeLogs', JSON.stringify(logs));
            
            displayLogs();
            alert("Imehifadhiwa!");
        }

        function displayLogs() {
            const list = document.getElementById('logList');
            const logs = JSON.parse(localStorage.getItem('coffeeLogs')) || [];
            list.innerHTML = logs.reverse().map(l => `
                <div class="log-item">
                    <span><strong>${l.name}</strong> (${l.method})<br><small>${l.date} | ⏱ ${l.time}</small></span>
                    <span style="color:#d4a017">${'★'.repeat(l.rating)}</span>
                </div>
            `).join('');
        }

        window.onload = () => { setGreeting(); displayLogs(); };
    </script>
</body>
</html>
